[package]
name = "rustgit-transport-iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
# Iroh 1.x needs Rust 1.91; the rest of the workspace builds on 1.89.
rust-version = "1.91"
description = "Iroh (QUIC, hole punching, encrypted relay fallback) transport for the rustgit sync protocol"

[dependencies]
rustgit-protocol = { path = "../protocol" }
# `default-features = false` drops `portmapper` (silently opening router ports), `metrics`, and
# `fast-apple-datapath` (private Apple socket APIs). See docs/decisions.md D20.
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-lite = "2"

[dev-dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "test-utils"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server", "test-utils"] }
rustgit-core = { path = "../core" }
rustgit-host = { path = "../host" }
rustgit-store = { path = "../store" }
serde_json = "1.0.154"
tempfile = "3.27.0"
