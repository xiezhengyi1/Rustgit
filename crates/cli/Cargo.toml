[package]
name = "rustgit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rgit"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dhat = { version = "0.3.3", optional = true }
rustgit-core = { path = "../core" }
rustgit-discovery = { path = "../discovery" }
rustgit-host = { path = "../host" }
rustgit-protocol = { path = "../protocol" }
rustgit-store = { path = "../store" }
rustgit-transport-iroh = { path = "../transport-iroh", optional = true }
rustgit-transport-ssh = { path = "../transport-ssh" }
serde ={ version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# `iroh://` remotes and `serve --iroh` (QUIC, NAT traversal, relay fallback). Needs Rust 1.91+
# and adds 165 crates; see docs/decisions.md D20 for build time and binary size.
iroh = ["dep:rustgit-transport-iroh"]
# Heap profiling: cargo build --profile profiling --features dhat-heap; writes dhat-heap.json on exit
dhat-heap = ["dep:dhat"]
