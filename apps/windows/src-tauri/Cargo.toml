[package]
name = "rustgit-windows"
version = "0.1.0"
description = "Windows desktop app for rustgit (Tauri shell around the bundled rgit CLI)"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
default-run = "rustgit-windows"

# This crate is its own workspace root so the engine workspace (../../Cargo.toml) is not
# affected by the Tauri dependency tree, and `cargo test --workspace` there stays fast.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
